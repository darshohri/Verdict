<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="v-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#FF3A00" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#FF3A00" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background transparent -->
  <rect width="512" height="512" fill="transparent" />
  <!-- A much bigger V, filled, no outline -->
  <path d="M40 40 L256 460 L472 40 L360 40 L256 310 L152 40 Z" 
        fill="url(#v-gradient)" 
        filter="url(#shadow)" 
        stroke-linejoin="round"/>
</svg>
